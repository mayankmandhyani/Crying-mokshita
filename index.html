<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOKSHITA: The Quest for Common Sense (3D)</title>
<style>
  :root {
    --panel-bg: rgba(20, 14, 36, 0.72);
    --accent: #ffd166;
    --accent-2: #ff8a5c;
    --text-hi: #fdf6ff;
    --text-mid: #cabde0;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d0818;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #game-canvas { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ---------------- HUD ---------------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top)) 16px 0;
    pointer-events: none;
  }
  .hud-pill {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 9px 16px;
    color: var(--text-hi);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    pointer-events: auto;
  }
  #level-pill { display: flex; flex-direction: column; gap: 2px; }
  #level-pill .sub { font-weight: 400; color: var(--text-mid); font-size: 11px; }
  #cs-pill {
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.15s ease;
  }
  #cs-pill.pop { transform: scale(1.15); }
  #cs-icon { font-size: 16px; transition: filter 0.2s ease; }
  #cs-icon.glow { filter: drop-shadow(0 0 8px #ffd166); }
  #cs-value { color: var(--accent); }

  /* ---------------- Mobile controls ---------------- */
  #mobile-controls {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 18px max(18px, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #mobile-controls.visible { display: flex; }
  .stick-zone { width: 120px; height: 120px; pointer-events: auto; position: relative; }
  .stick-base {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  }
  .stick-knob {
    position: absolute; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,138,92,0.35); border: 1px solid rgba(255,138,92,0.5);
    left: 34px; top: 34px; transition: none;
  }
  #jump-btn {
    pointer-events: auto;
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(255,138,92,0.22); border: 1px solid rgba(255,138,92,0.4);
    color: #fdf6ff; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
  }
  #jump-btn:active { background: rgba(255,138,92,0.4); }

  /* ---------------- Overlays / screens ---------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center;
    background: rgba(8,5,16,0.78);
    backdrop-filter: blur(6px);
    text-align: center;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .overlay.active { display: flex; opacity: 1; }
  .overlay-panel {
    max-width: 460px; width: 88vw;
    background: rgba(30,22,50,0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 34px 28px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  }
  .overlay-panel h1 {
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .overlay-panel p { color: var(--text-mid); font-size: 0.95rem; line-height: 1.5; margin: 8px 0; }
  .overlay-panel .btn {
    margin-top: 18px; padding: 14px 30px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #251208; font-weight: 700; font-size: 1rem; cursor: pointer;
  }

  #boot-screen { z-index: 30; }
  #boot-bar-track { width: 240px; height: 8px; border-radius: 20px; background: rgba(255,255,255,0.1); margin: 16px auto 0; overflow: hidden; }
  #boot-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.2s ease; }

  #death-fade {
    position: fixed; inset: 0; z-index: 15; background: #050208;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  #death-fade.active { opacity: 1; }

  #toast-stack {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%); z-index: 8;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  .toast {
    background: rgba(24,17,41,0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 8px 16px; color: #fdf6ff; font-size: 13px;
    font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    animation: toastIn .25s ease, toastOut .25s ease 1.6s forwards;
  }
  @keyframes toastIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { to{opacity:0;transform:translateY(-6px)} }

  #confetti-layer { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
  .confetti-piece { position: absolute; top: -20px; border-radius: 2px; opacity: 0.9; animation: confettiFall linear forwards; }
  @keyframes confettiFall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.5; } }

  button:focus-visible { outline: 2px solid #7ee8fa; outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-pill" id="level-pill">
    <span id="level-title">Level 1</span>
    <span class="sub" id="level-subtitle">The Journey Begins</span>
  </div>
  <div class="hud-pill" id="cs-pill">
    <span id="cs-icon">🧠</span>
    <span><span id="cs-value">0</span> / <span id="cs-total">0</span></span>
  </div>
</div>

<div id="toast-stack"></div>
<div id="death-fade"></div>

<!-- Mobile controls -->
<div id="mobile-controls">
  <div class="stick-zone" id="move-stick">
    <div class="stick-base"></div>
    <div class="stick-knob" id="stick-knob"></div>
  </div>
  <button id="jump-btn" aria-label="Jump">▲</button>
</div>

<!-- Boot screen -->
<div class="overlay active" id="boot-screen">
  <div class="overlay-panel" style="text-align:center;">
    <h1>MOKSHITA</h1>
    <p style="margin-top:-4px;">The Quest for Common Sense — 3D</p>
    <div id="boot-bar-track"><div id="boot-bar-fill"></div></div>
    <p id="boot-status" style="font-size:0.8rem;">Loading a whole third dimension…</p>
  </div>
</div>

<!-- Start screen -->
<div class="overlay" id="start-screen">
  <div class="overlay-panel">
    <h1>MOKSHITA</h1>
    <p>The Quest for Common Sense</p>
    <p style="font-size:0.85rem;">She is close. She is always close. She will not get there.</p>
    <button class="btn" id="btn-start">Begin the Quest</button>
    <p style="font-size:0.75rem; margin-top:16px;">WASD / Arrows to move · Space to jump · Shift to run</p>
  </div>
</div>

<!-- Transition screen (gate/portal messages) -->
<div class="overlay" id="transition-screen">
  <div class="overlay-panel" id="transition-panel"></div>
</div>

<!-- Final ending screen -->
<div class="overlay" id="final-screen">
  <div id="confetti-layer"></div>
  <div class="overlay-panel" id="final-panel" style="position:relative; z-index:2;"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
